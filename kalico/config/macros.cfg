# ThetaFirm macros for Kalico
#
# Homing does not need macros: G28 homes B, X, C and Z (see
# [core_rtheta] in printer.cfg for the Z homing choreography).  "G28 B",
# "G28 X", "G28 C" and "G28 Z" home single axes.

# RRF to4axis.g / topolar.g equivalents
[gcode_macro TO_4AXIS]
description: G-code X/C/Z/B are machine coordinates (RRF to4axis.g)
gcode:
  THETA_MODE MODE=4AXIS

[gcode_macro TO_POLAR]
description: G-code X/Y/Z are Cartesian bed coordinates (RRF topolar.g)
gcode:
  THETA_MODE MODE=POLAR

# Tilt poses.  Angles come from [core_rtheta] nozzle_b_angle/probe_b_angle.
[gcode_macro NOZZLE_DOWN]
description: Point the nozzle down
gcode:
  {% set b = printer.configfile.settings.core_rtheta.nozzle_b_angle %}
  {% set speed = printer.configfile.settings.core_rtheta.b_travel_speed %}
  SAVE_GCODE_STATE NAME=theta_pose
  G90
  G94
  G1 B{b} F{speed * 60}
  RESTORE_GCODE_STATE NAME=theta_pose

[gcode_macro PROBE_DOWN]
description: Point the Z probe down
gcode:
  {% set b = printer.configfile.settings.core_rtheta.probe_b_angle %}
  {% set speed = printer.configfile.settings.core_rtheta.b_travel_speed %}
  SAVE_GCODE_STATE NAME=theta_pose
  G90
  G94
  G1 B{b} F{speed * 60}
  RESTORE_GCODE_STATE NAME=theta_pose

# PRINT_START [MODE=4AXIS|POLAR] [HOTEND=<temp>]
# Suggested slicer start G-code:
#   PRINT_START MODE=4AXIS HOTEND=[nozzle_temperature_initial_layer]
[gcode_macro PRINT_START]
description: Home, heat and select the G-code mode for a print
gcode:
  {% set mode = params.MODE|default("4AXIS")|upper %}
  {% set hotend = params.HOTEND|default(0)|float %}
  CLEAR_PAUSE
  G90
  M83
  G94
  {% if hotend > 0 %}
    M104 S{hotend}
  {% endif %}
  {% if "xyz" not in printer.toolhead.homed_axes or not printer.toolhead.b_homed %}
    G28
  {% endif %}
  THETA_MODE MODE={mode}
  {% if hotend > 0 %}
    M109 S{hotend}
  {% endif %}

[gcode_macro PRINT_END]
description: Retract, lift, point the nozzle down and switch off heaters
gcode:
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set z = [printer.toolhead.position.z + 10, max_z]|min %}
  G94
  M83
  G1 E-2 F1800
  G90
  G1 Z{z} F1200
  NOZZLE_DOWN
  M104 S0
  M107
  THETA_MODE MODE=4AXIS

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  PRINT_END
  CANCEL_PRINT_BASE

[pause_resume]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]
