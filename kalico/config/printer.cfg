# Kalico configuration for the ThetaFirm "Core R-Theta" 4 axis polar
# printer on a Mellow Fly-E3-Pro-v3 (STM32F407, onboard TMC2209).
#
# Translated from "reprap firmware config/" (RepRapFirmware 3.5).
# Requires the core_rtheta plugin (see kalico/README.md).
#
# Driver slots (RRF driver number -> board slot -> this config):
#   driver 0  X slot   -> [stepper_c]  bed rotation (C)
#   driver 1  Y slot   -> [stepper_x]  core motor A  (= X - k*B)
#   driver 2  Z slot   -> [stepper_b]  core motor B  (= X + k*B)
#   driver 3  E0 slot  -> [extruder]
#   driver 4  E1 slot  -> [stepper_z]
#
# !!! Before the first move, check every motor direction (see the
# !!! commissioning section of kalico/README.md).  The dir_pin values
# !!! below follow the RRF M569 S settings but RRF may reverse TMC2209
# !!! drivers internally, so they can differ on your machine.

[include macros.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_REPLACE_ME-if00

[printer]
kinematics: core_rtheta
# Units in 4 axis mode are mixed (mm and degrees are treated alike,
# like RRF with "M584 S0").  Per-axis limits are in [core_rtheta].
max_velocity: 500
max_accel: 5000
square_corner_velocity: 5.0

[core_rtheta]
# Belt length moved by each core motor per degree of tilt:
# 40T tilt pulley * 2mm pitch / 360 degrees (RRF M669 B factor 0.2222)
b_mm_per_degree: 0.222222
# Per-axis limits, from RRF M203/M201 (to4axis.g)
max_x_velocity: 333
max_x_accel: 5000
max_c_velocity: 360
max_c_accel: 2000
max_z_velocity: 133
max_z_accel: 1500
max_b_velocity: 360
max_b_accel: 2000
# RRF "jerk" (M566) for B, in deg/s
b_instantaneous_corner_velocity: 10
# Tilt angles.  B=0 nozzle down, B=-90 Z probe down, B=+90 end stop.
nozzle_b_angle: 0
probe_b_angle: -90
# Z homing: lift, turn the probe down, move to X, probe, lift, turn the
# nozzle down again.
z_home_x: 0
z_hop: 10
z_hop_speed: 20
z_home_travel_speed: 100
b_travel_speed: 180

# Core motor A (RRF driver 1).  Its position_* and homing settings
# describe the X (radius) axis.
[stepper_x]
step_pin: PB9
dir_pin: !PB8
enable_pin: !PE1
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
# RRF: M208 X-37.5 / X{X_LENGTH}; M574 X2 S3
position_min: -37.5
position_endstop: 115.5
position_max: 115.5
homing_speed: 60
homing_retract_dist: 10
homing_retract_speed: 60

[tmc2209 stepper_x]
uart_pin: PE0
sense_resistor: 0.110
diag_pin: ^PB10
interpolate: True
run_current: 0.92
home_current: 0.65
stealthchop_threshold: 180
# RRF M915 X S0 - tune with the Klipper sensorless homing guide
driver_SGTHRS: 100

# Core motor B (RRF driver 2).  Its position_* and homing settings
# describe the B (tilt) axis, in degrees.
[stepper_b]
step_pin: PA15
dir_pin: PD7
enable_pin: !PC2
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_b:virtual_endstop
# RRF: M208 B-180 / B90; M574 B2 S3
position_min: -180
position_endstop: 90
position_max: 90
homing_speed: 120
homing_retract_dist: 10
homing_retract_speed: 60

[tmc2209 stepper_b]
uart_pin: PA8
sense_resistor: 0.110
diag_pin: ^PC4
interpolate: True
run_current: 0.92
home_current: 0.46
stealthchop_threshold: 180
# RRF M915 B S-10 - tune with the Klipper sensorless homing guide
driver_SGTHRS: 110

# Bed rotation (RRF driver 0).  Degrees; 88.889 steps/deg at 16 microsteps
[stepper_c]
step_pin: PE3
dir_pin: !PE2
enable_pin: !PE5
microsteps: 16
rotation_distance: 36

[tmc2209 stepper_c]
uart_pin: PE4
sense_resistor: 0.110
interpolate: True
run_current: 0.92
stealthchop_threshold: 0

# Z lead screw (RRF driver 4), 400 steps/mm at 16 microsteps
[stepper_z]
step_pin: PC13
dir_pin: !PC0
enable_pin: !PC15
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
# RRF: M208 Z-50 / Z200
position_min: -50
position_max: 200
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC14
sense_resistor: 0.110
interpolate: True
run_current: 0.57
stealthchop_threshold: 0

# Switch probe on the X endstop input (RRF: M558 P5 C"^xstop", G31 Z-8.5)
# It is on the tilting toolhead and only faces down at B=probe_b_angle.
[probe]
pin: ^PA2
x_offset: 0
y_offset: 0
z_offset: -8.5
speed: 8
lift_speed: 20
samples: 1

[thermistor theta_hotend]
# RRF: M308 S0 T100000 B4956 C1.587780e-7, as three reference points
temperature1: 25
resistance1: 100000
temperature2: 150
resistance2: 1762.99
temperature3: 250
resistance3: 230.0

[extruder]
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6
microsteps: 16
# 932 steps/mm at 16 microsteps (BIQU H2 V2S)
rotation_distance: 3.4335
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA5
sensor_pin: PA4
sensor_type: theta_hotend
# Run PID_CALIBRATE HEATER=extruder TARGET=220 and SAVE_CONFIG
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
# RRF: M143 H0 S270
max_temp: 275
# RRF: M302 P1 allows cold extrusion
min_extrude_temp: 0
max_extrude_only_velocity: 60
max_extrude_only_accel: 500
instantaneous_corner_velocity: 5
# Moves are measured in mixed units in 4 axis mode (1 degree of C can
# be longer than 1mm of travel at large radius), so allow a margin
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: PD5
sense_resistor: 0.110
interpolate: True
run_current: 0.57
stealthchop_threshold: 0

# Hotend fan, thermostatic (RRF: M950 F0 C"fan1", M106 P0 H0 T50)
[heater_fan hotend_fan]
pin: PA6
heater: extruder
heater_temp: 50.0

# Part cooling / aquarium pump (RRF: M950 F1 C"!PA_7" Q50)
[fan]
pin: !PA7
cycle_time: 0.020

[temperature_sensor mcu]
sensor_type: temperature_mcu

[idle_timeout]
# RRF: M84 S30 (motors off after 30s idle).  Disabling the motors loses
# the X/B/C/Z positions, so a longer timeout is used here.
timeout: 600

# Accelerometer on EXP2 (RRF: M955 P0 C"PB_2+PA_10")
#[adxl345]
#cs_pin: PB2
#spi_bus: spi3
