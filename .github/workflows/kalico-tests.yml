name: Kalico plugin simulation tests

on:
  push:
    paths:
      - "kalico/**"
      - ".github/workflows/kalico-tests.yml"
  pull_request:
    paths:
      - "kalico/**"
      - ".github/workflows/kalico-tests.yml"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kalico commit the plugin was developed against
          - kalico_ref: 84a4105726e22c5c15943e791b5cdb3beff52e77
            experimental: false
          # Early warning for upstream changes to toolhead internals
          - kalico_ref: main
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Set up Kalico and simulator
        run: |
          KALICO_REF=${{ matrix.kalico_ref }} kalico/tests/setup_env.sh \
            "$RUNNER_TEMP/sim" | tee "$RUNNER_TEMP/env.sh"
      - name: Run tests
        run: |
          source "$RUNNER_TEMP/env.sh"
          cd kalico/tests
          pytest -q
